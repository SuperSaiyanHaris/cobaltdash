name: CI

# Lint + production build on every push to main and every PR. Deploys go
# straight from main to Vercel, so this is the only gate between a commit and
# production: a red run here means the commit that just shipped has a problem.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (errors fail the build; warnings are reported)
        run: npm run lint
      # `vite build` only: the full `npm run build` also regenerates the sitemap
      # and OG images, which need production Supabase credentials.
      - name: Build
        run: npx vite build
