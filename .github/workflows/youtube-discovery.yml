name: Creator Discovery (all platforms)

on:
  schedule:
    # Run 4x daily (every 6 hours) to discover new creators
    # Optimized from 6x daily to stay within GitHub Actions budget
    # 00:00 UTC (6 PM CST)
    - cron: '0 0 * * *'
    # 06:00 UTC (12 AM CST)
    - cron: '0 6 * * *'
    # 12:00 UTC (6 AM CST)
    - cron: '0 12 * * *'
    # 18:00 UTC (12 PM CST)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  discover-creators:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Discover YouTube creators
        id: youtube
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: node scripts/discoverYouTubeCreators.js

      - name: Discover Kick creators
        id: kick
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
        run: node scripts/discoverKickCreators.js

      - name: Discover Twitch creators
        id: twitch
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
          VITE_TWITCH_CLIENT_SECRET: ${{ secrets.VITE_TWITCH_CLIENT_SECRET }}
        run: node scripts/discoverTwitchCreators.js

      - name: Queue TikTok candidates from existing creators
        id: tiktok
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/discoverTikTokCreators.js 50

      - name: Discover Bluesky creators
        id: bluesky
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/discoverBlueskyCreators.js

      - name: Discover Mastodon creators
        id: mastodon
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/discoverMastodonCreators.js

      - name: Discover Music artists
        id: music
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LASTFM_CLIENT_ID: ${{ secrets.LASTFM_CLIENT_ID }}
        run: node scripts/discoverMusicArtists.js

      - name: Summarize results
        if: always()
        run: |
          declare -A results=(
            [YouTube]="${{ steps.youtube.outcome }}"
            [Kick]="${{ steps.kick.outcome }}"
            [Twitch]="${{ steps.twitch.outcome }}"
            [TikTok]="${{ steps.tiktok.outcome }}"
            [Bluesky]="${{ steps.bluesky.outcome }}"
            [Mastodon]="${{ steps.mastodon.outcome }}"
            [Music]="${{ steps.music.outcome }}"
          )
          failed=0
          for platform in "${!results[@]}"; do
            if [ "${results[$platform]}" = "success" ]; then
              echo "✅ $platform"
            else
              echo "❌ $platform"
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo ""
            echo "One or more platforms failed this run. Others still ran normally."
            exit 1
          fi
          echo ""
          echo "✅ All platforms discovered successfully"
