name: Twitch Stream Monitor

on:
  # Scheduled runs moved to Vercel Cron (api/cron/stream-monitor.js, every 5
  # min) on 2026-09-25: GitHub throttled this */5 schedule to ~5 runs a day.
  # Kept as a manual fallback only.
  workflow_dispatch:

jobs:
  monitor-streams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Monitor Twitch streams
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
          VITE_TWITCH_CLIENT_SECRET: ${{ secrets.VITE_TWITCH_CLIENT_SECRET }}
        run: node scripts/monitorTwitchStreams.js

      - name: Report completion
        if: success()
        run: echo "✅ Stream monitoring completed"
