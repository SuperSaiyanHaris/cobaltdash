<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track YouTube, TikTok, Twitch, Kick, Bluesky, Mastodon, Substack, and Music creator statistics. View subscriber counts, follower growth, rankings and analytics." />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Canonical URL (middleware and SEO component update this per-page) -->
    <link rel="canonical" href="https://shinypull.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shinypull.com/" />
    <meta property="og:title" content="ShinyPull - Creator Analytics" />
    <meta property="og:description" content="Track YouTube, TikTok, Twitch, Kick, Bluesky, Mastodon, Substack, and Music creator statistics. View subscriber counts, follower growth, rankings and analytics." />
    <meta property="og:image" content="https://shinypull.com/og/home.jpg" />
    <meta property="og:site_name" content="ShinyPull" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShinyPull - Creator Analytics" />
    <meta name="twitter:description" content="Track YouTube, TikTok, Twitch, Kick, Bluesky, Mastodon, Substack, and Music creator statistics. View subscriber counts, follower growth, rankings and analytics." />
    <meta name="twitter:image" content="https://shinypull.com/og/home.jpg" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://ziiqqbfcncjdewjkbvyq.supabase.co" crossorigin>
    <!-- AdSense preconnect removed with the script itself (see the disabled
         AdSense block further down). Restore this line when re-enabling ads,
         or the handshake waits until the script is parsed. -->
    <!-- <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin> -->

    <!-- Avatar CDNs. These two serve 73% of every avatar we render (Twitch
         24.3K creators, YouTube 7.1K) and appear on the home marquee plus every
         rankings, search, and profile page. Without this the handshake can't
         start until React has rendered and created the <img> elements, which on
         mobile is several hundred ms of DNS+TCP+TLS on the critical path.
         Deliberately not preconnecting the other six avatar hosts — each one
         holds a connection open, and past ~6 the hints start costing more than
         they save. -->
    <link rel="preconnect" href="https://static-cdn.jtvnw.net" crossorigin>
    <link rel="preconnect" href="https://yt3.ggpht.com" crossorigin>

    <!-- Google Fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"></noscript>

    <title>ShinyPull - Social Media Statistics</title>

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ShinyPull",
      "url": "https://shinypull.com",
      "logo": "https://shinypull.com/apple-touch-icon.png",
      "description": "Social media analytics platform tracking YouTube, TikTok, Twitch, Kick, Bluesky, Mastodon, Substack, and Music creator statistics.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "shinypull@proton.me",
        "contactType": "customer support"
      },
      "sameAs": []
    }
    </script>

    <!-- WebSite structured data (enables Google Sitelinks Search Box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShinyPull",
      "url": "https://shinypull.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://shinypull.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ADSENSE-DISABLED-MARKER: re-enable the tag above when reapplying -->

    <!-- Google Analytics (deferred - non-blocking) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // GA4 auto-redacts any page_path containing '@' as likely PII (looks like
      // an email), which silently collapses Mastodon profile views
      // (/mastodon/user@instance.tld) into one opaque "(redacted)" bucket.
      // Swap '@' for '-at-' in the reported path only; the real URL is untouched.
      gtag('config', 'G-1KWMEM41YG', {
        page_path: location.pathname.replace(/@/g, '-at-') + location.search,
      });
      window.addEventListener('load', function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-1KWMEM41YG';
        s.async = true;
        document.head.appendChild(s);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
